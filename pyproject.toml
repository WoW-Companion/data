[project]
name = "wowc-data"
version = "0.1.0"
description = "Build pipeline for the public WoW: Forever dataset"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["pyarrow", "duckdb", "pyyaml", "jsonschema"]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wowc_data"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
