name: dataset

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "curated/**"
      - "internal/**"
      - "cmd/**"
      - "schemas/**"

permissions:
  contents: write

concurrency:
  group: dataset
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Latest build and release state
        id: check
        run: go run ./cmd/wowc-data release-check
      - name: Fetch client tables and Everloot rates
        if: steps.check.outputs.publish == 'true'
        run: go run ./cmd/wowc-data fetch -build "${{ steps.check.outputs.build }}"
      - name: Build the dataset
        if: steps.check.outputs.publish == 'true'
        run: go run ./cmd/wowc-data build -build "${{ steps.check.outputs.build }}"
      - name: Verify the manifest
        if: steps.check.outputs.publish == 'true'
        run: go run ./cmd/wowc-data verify-manifest "dist/${{ steps.check.outputs.build }}"
      - name: Pack and publish
        if: steps.check.outputs.publish == 'true'
        env:
          BUILD: ${{ steps.check.outputs.build }}
          REPUBLISH: ${{ steps.check.outputs.exists }}
        run: scripts/pack-and-publish.sh
